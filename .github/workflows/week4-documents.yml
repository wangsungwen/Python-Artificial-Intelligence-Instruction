name: Build Week4 Word and PPTX
on:
  push:
    paths:
      - '五週Python人工智慧教學包/第4週/2026新版_三小時整合課程/build_week4_documents.py'
      - '.github/workflows/week4-documents.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install python-docx python-pptx
      - run: python "五週Python人工智慧教學包/第4週/2026新版_三小時整合課程/build_week4_documents.py"
      - name: Commit generated documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "五週Python人工智慧教學包/第4週/2026新版_三小時整合課程/*.docx" "五週Python人工智慧教學包/第4週/2026新版_三小時整合課程/*.pptx"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: generate week4 editable Word and PowerPoint"
          git push
